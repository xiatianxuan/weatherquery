[project]
name = "weatherquery"
version = "0.1.0"
description = "A Python library and CLI tool for querying weather data from wttr.in API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.25.1",
]

[project.scripts]
weatherquery = "weatherquery.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
